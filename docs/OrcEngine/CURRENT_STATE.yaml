explicit_non_goals:
  - replacing LLamaSharpRuntime
  - replacing OllamaRuntime
  - production default changes
  - competitive performance in the correctness phase
  - CUDA before CPU correctness
  - quantization before float correctness
  - multiple model architectures
  - continuous batching
  - LoRA or adapter hot_swap
  - grammar constrained decoding
  - multimodal models
  - multi_GPU or HIVE distribution

