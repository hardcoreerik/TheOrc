  summary: >-
    Phase 3 is frozen at 98dbcf1f under orcengine-phase3-freeze. Phase 4 is
    FORMALLY FROZEN as of 2026-08-18 (OE-ADR-024) at 944f07b8 under the
    immutable pushed annotated tag orcengine-phase4-freeze, remote-verified.
    Independent review (OE-ADR-022, ACCEPT WITH FIXES) and self-validated
    closure (OE-ADR-023) preceded the freeze; no engine defect was found at
    any point. Phase 5 (practical CPU inference semantics) is now assigned
    and IN PROGRESS as 5A (KV-cached incremental decode reference) on a new
    worktree/branch; old Phase 5 (quantization) renumbered to Phase 6 -- see
    OE-ADR-024 for the full chronology and renumbering table. Logical row
    regions supply unique embedding rows and output
    chunks while preserving Phase-3 layer streaming. Explicit and tied real
    artifacts are bit-identical to frozen Phase 3 across six chunk sizes and
    four generated steps, and match Hugging Face/PyTorch. Measured peak is
    14,162,688 bytes for both artifacts CONDITIONAL on output_chunk_rows
    staying at or below 6,146 rows for this model (all six tested chunk sizes
    qualify) -- found during independent review (adversarial Grok pass,
    confirmed against streaming.cpp): a documentation-precision correction,
    not a code defect, since the residency budget check correctly enforces
    whatever limit is configured for any chunk size. Frozen Phase 3 rejects
    that budget, Phase 4 succeeds exactly there for the tested range, and
    peak-minus-one rejects. Independent review reproduced: 12/12 deterministic
    tests (Debug and Release, no real-artifact options), 20/20 real-artifact
    Release campaign (after a directory-junction workaround for a known
    pre-existing Phase-2 oracle path issue, same fix Phase 3's own hardening
    report already documents), 12/12 strict /W4 /WX /permissive- lane. ASan
    not independently re-run. See PHASE4_BOOKEND_VIRTUALIZATION.md for
    corrected evidence.

    Phase 2 is implemented and freeze-hardened on feat/orcengine-phase2-gguf. The
    strict GGUF v3 reader indexes real file-backed
    tensor extents without loading payloads, maps one dense Llama profile into semantic
    tensors, materializes F32 and F16-to-F32 only, and executes a converted real
    SmolLM2-135M through the unchanged Phase-1 operators. Direct Hugging Face/PyTorch,
    the Phase-0 oracle, explicit-output GGUF execution, and tied-output GGUF execution
    generated [1, 5, 28, 284, 260, 198] identically, with all compared elements
    satisfying the declared 1e-3 absolute-or-relative gate; tied and explicit artifacts
    were bit-identical in logits and taps. A sparse synthetic tensor beyond 4 GiB proves
    the default cap is configurable policy and that extent arithmetic remains 64-bit. A real
    mixed-quantized SmolLM2-360M artifact indexes and cross-checks exactly against
    gguf-py but is deliberately not executable. Debug 14/14, Release 14/14, strict
    /W4 /WX 10/10, and ASan 11/11 lanes pass with explicit exclusions documented in
    PHASE2_FREEZE_HARDENING.md. No CUDA, quantized compute, tokenizer, paging, or
    product integration exists.

    Phase 0 (deterministic reference oracle) is COMPLETE as of 2026-08-15: all 14
    required checks in PHASE_0_ACCEPTANCE.yaml read pass, and the maintainer
    (hardcoreerik) approved the bounded product-value thesis (OE-ADR-016) as written.
    This proves the oracle/comparison methodology is correct against hand-derived
    ground truth, an independently-written second implementation, a pinned llama.cpp
    deployment oracle, and the real HuggingFace reference implementation for the real-
    model candidate (SmolLM2-135M).

    Phase 1 (tiny synthetic float32 CPU transformer, C++20) is IMPLEMENTED as of
    2026-08-15 on branch feat/orcengine-phase1 (worktree
    F:/Ai/OrchestratorIDE-phase1), based on feat/orcengine-phase0's tip. A real,
    dependency-free C++ project (Tools/OrcEnginePhase1/) reuses Phase 0's Fixture C
    dimensions, implements every operator in one transformer block, and its
    differential test harness passes every intermediate tap plus final logits plus
    greedy argmax against Python-oracle-exported fixtures (tied AND untied lm_head),
    with measured divergence at float32 machine-epsilon scale (~1e-7), four orders of
    magnitude inside the 1e-3 acceptance threshold. The harness was verified to
    actually catch injected faults, not just pass trivially. This is still a
    synthetic-fixture-only reference core: it does NOT load GGUF, does NOT execute a
    real model, has NO CUDA/quantization/batching, and has NO TheOrc product
    integration. Existing TheOrc runtime paths remain authoritative and unchanged.
    Per the steering document's explicit instruction, Phase 1 stopped for review at
    that checkpoint and was subsequently accepted and frozen. See
    PHASE1_IMPLEMENTATION.md for full detail.

    On 2026-08-16 the independent Codex freeze review's confirmed findings were
    hardened into executable regressions. The gate now requires 36 structural
    expectations per fixture (72 total), decode tolerances and positive step work
    are enforced, malformed models fail through central validation before forward
    math, all six F32/F64 variants are registered with CTest, and the storage test
    now materializes every weight from retained in-memory F32Raw BackingExtents.
    This remains a narrow synthetic reference proof, not GGUF or production support.

    A separate, explicitly non-architectural research track ("Fringe Lab",
    research/orcengine-fringe-lab) also exists as of 2026-08-15, testing
    unconventional memory/execution assumptions in isolation from both Phase 0
    and Phase 1: chunked lm_head streaming (both in-RAM NumPy slicing and, as a
    freeze-audit follow-up, real disk seek()/read() I/O against the real local
    Meta-Llama-3.1-8B output head -- exact argmax held at every chunk size down
    to single-row reads, though the disk-bandwidth-bound cost is still unmeasured
    due to a warm page cache) and cache-policy simulation across 5 execution
    shapes (single-context decode, staggered multi-context, MoE routing,
    speculative verification) -- finding NextUse's advantage over LRU is real but
    regime-dependent, not universal. See FRINGE_LAB.md.
    Nothing from it has been promoted into OrcEngine architecture.

    Since Phase 0 closed, the same session extended the fault-injection suite into
    ablation-study diagnostic tooling (oracle/ablation_sweep*.py) and, while making that
    tooling work against real oversized models, produced evidence that materially changes
    what Phase 6 (CUDA) and Phase 7 (stable ABI) should assume: a true streaming execution
    path (oracle/gguf_streaming_loader.py) proved a model does NOT need to fit in VRAM (or
    even be materialized all at once) to execute -- Meta-Llama-3.1-8B, unloadable under
    every earlier approach in this same session, completed a full ablation sweep using
    3.17GB peak VRAM by loading one transformer layer from disk at a time. A follow-on
    architectural correction (multi-branch ablation via LayerIntervention, not N-times
    weight cloning) generalizes to "an ablation/adapter/precision-change is an execution
    intervention on immutable shared weights, not a modified model copy" -- see OE-ADR-019
    and ENGINEERING_ROADMAP.md's Phase 6A-6D split for how this changes the roadmap before
    Phase 1 begins. This tooling ALSO caught and corrected a real bug in Phase 0's own
    oracle code: every forward pass silently used the tied-embedding logit formula even for
    models with a distinct, untied output.weight tensor -- the first Llama-3.1-8B artifact
    this produced was invalidated and replaced (OE-ADR-019, full provenance retained).

    Separately, the same architecture-steering review found and fixed two real correctness
    gaps in the PRODUCTION Native Runtime (not OrcEngine): the persistent per-role tool-call
    path was not grammar-constrained to the live tool registry (only the stateless path was,
    despite a docstring claiming otherwise), and an unknown base-model VRAM cost was silently
    treated as zero (fail-open admission) rather than denied. Both fixed, tested (809 passed /
    0 failed on the full C# suite), and pushed to fix/native-runtime-grammar-and-admission --
    a separate branch off master, not merged into feat/orcengine-phase0, pending maintainer
    review/merge.

    Phase 5A (KV-cached incremental decode reference, feat/orcengine-phase5a-kv-cache)
    is implemented, composed with Phase 3/4's virtualized streaming path (Reference
    Path C, OE-ADR-027), and real-model validated. A 2026-08-18 independent review
    (OE-ADR-028) found 11 findings against the composition candidate; all are closed
    with new/hardened tests. The registered CTest suite grew from 18 to 30 tests. Full
    four-lane validation matrix against the closure HEAD: Debug 30/30, Release 30/30,
    strict (/W4 /WX /permissive- /EHsc) 30/30 zero warnings. MSVC ASan is reported as
    an honest split, not a clean CTest pass: CTest itself reports 22/30 with 8 timeouts
    and exit code 8 (inherited 300-900s TIMEOUT properties in frozen Phase 2/3
    CMakeLists.txt, exceeded by ASan's ~28-40x real-model slowdown, not a correctness
    defect); those same 8 exact invocations were confirmed by direct invocation outside
    CTest's timeout mechanism, all exit 0 with no ASan diagnostic. See DECISION_LOG.md
    OE-ADR-028 for the full per-test evidence table. A follow-up 2026-08-19 Grok
    full+adversary freeze review against af2dc59b found 1 BLOCKER (this file's own
    top-level fields, being corrected in this same pass), 3 FIX-BEFORE-FREEZE items
    (a CMake environment-fallback ordering bug, now fixed; two closure-record wording
    corrections), and 2 OPTIONAL strengthening opportunities, none of which reopen any
    of the 11 original findings. All confirmed BLOCKER and FIX-BEFORE-FREEZE findings
    were resolved in subsequent bounded commits, and focused diff reviews of those
    corrections came back clean. On 2026-08-20 the maintainer explicitly approved Phase
    5A for formal local freeze; Phase 5A is now ACCEPTED AND FROZEN under the annotated
    tag orcengine-phase5a-freeze (see DECISION_LOG.md OE-ADR-029). Gate item 15
    (per-step backing-I/O granularity) remains an accepted, explicitly bounded partial;
    the optional real-GGUF resident-ledger duplicate assertion remains deferred future
    strengthening, not a freeze blocker. The tag and branch remain local and have not
    been pushed. Phase 5B specification drafting started 2026-08-20 on
    feat/orcengine-phase5b-tokenizer (forked from the freeze tag via a
    separate worktree); the maintainer subsequently approved that
    specification for implementation the same day, including all seven
    previously-unresolved policy decisions (see DECISION_LOG.md
    OE-ADR-030). Phase 5B implementation Stage 1 (native GGUF
    tokenizer-metadata construction and fail-closed validation,
    Tools/OrcEnginePhase5B/) was implemented 2026-08-20 and closure-
    corrected the same day: real pinned GGUF artifacts now exercised
    (not synthetic-only), merge-result concatenation validated,
    adversarial tests verify exception type and diagnostic content, and
    two tautological runtime checks removed. The closure-correction pass
    surfaced that smollm2-135m-tied.gguf has zero tokenizer.ggml.*
    metadata keys, leaving an open artifact-classification question. On
    the same day the maintainer resolved it (DECISION_LOG.md OE-ADR-031):
    smollm2-135m.gguf is the canonical, positive, tokenizer-bearing Phase
    5B artifact; smollm2-135m-tied.gguf is a frozen legacy tensor/
    output-head-equivalence fixture, not a positive tokenizer-bearing
    artifact, and its missing metadata is now a REQUIRED fail-closed
    rejection case, not a temporary gap. Explicit-vs-tied tokenizer-table
    equality -- never part of the specification accepted at commit
    83083145 -- was removed as a requirement. test_tokenizer_metadata now
    exposes three independent contracts, each registered and run
    separately (tokenizer_metadata, tokenizer_metadata_real_explicit,
    tokenizer_metadata_legacy_tied_rejection). Targeted-validated across
    Debug/Release/strict/ASan: all three contracts pass in every lane --
    the synthetic suite (136/136 checks), the canonical explicit
    real-artifact positive suite, and the legacy tied-artifact
    expected-rejection suite. No registered Phase 5B test intentionally
    fails. Stage 1 constructs and validates tables only. Same day,
    Stage 2A (DECISION_LOG.md OE-ADR-032) implemented exact native
    pretokenization (Tools/OrcEnginePhase5B/src/pretokenize.cpp),
    reproducing the pinned Digits(individual_digits=true)->
    ByteLevel(add_prefix_space=false, trim_offsets=true, use_regex=true)
    sequence and producing pretoken byte-range boundaries only (no
    byte-to-Unicode mapping, no BPE, no token IDs). Classification
    tables (\p{L}/\p{N}/\s) were generated from Python's unicodedata and
    then validated against the live tokenizers==0.22.2 oracle: 2,831
    range-boundary probes plus a 4,974-codepoint seeded random sample
    found 0 mismatches after correcting one discovered gap (Python
    str.isspace() incorrectly includes U+001C-U+001F, which the oracle
    does not treat as whitespace); a further 565-probe check confirmed
    the Digits stage's isolation predicate is identical to the \p{N}
    table. test_pretokenize compares the scanner byte-for-byte against a
    63-entry oracle-derived fixture corpus plus 8 invalid-UTF-8
    rejection cases: 209/209 checks pass, 0 failures, across
    Debug/Release/strict/ASan. This is boundary-agreement on that
    corpus and the described sampling, not exhaustive equivalence over
    all possible Unicode strings. Encode (token-ID production), BPE
    merge execution, byte-to-Unicode mapping, decode, streaming, and
    frozen-engine integration are NOT implemented. Phase 5B is NOT
    complete, accepted as a finished implementation, or frozen. The
    llama.cpp secondary-oracle comparison remains an outstanding
    validation dependency required before Phase 5B can be considered
    complete or frozen. Phase 5C remains deferred and
    unauthorized.

truth_labels:
  verified: directly observed in current code, reproducible evidence, or a primary source
  decided: accepted direction recorded in DECISION_LOG.md
  proposed: concrete design awaiting approval or evidence
  hypothesis: testable belief not yet demonstrated
  unknown: insufficient evidence
  out_of_scope: deliberately excluded from the current milestone

current_theorc_runtime:
  default:
    name: native_in_process
    construction: NativeWithFallbackRuntime_with_NoFallbackRuntime
    status: verified
    effective_since: "2026-07-29"
    failure_policy: fail_closed_no_automatic_ollama_substitution
  implementations:
    - name: OllamaRuntime
      execution: out_of_process_ollama
      status: verified
    - name: LlamaCppServerRuntime
      execution: out_of_process_llama_cpp_server
      status: verified
    - name: LLamaSharpRuntime
      execution: in_process_llamasharp_llama_cpp
      package_version: 0.27.0
      status: verified
  legacy_backend_field_default: Ollama
  legacy_backend_field_effect: used_when_native_main_chat_is_explicitly_disabled
  control_plane_owned_by_theorc:
    - runtime abstraction
    - prompt and tool pipeline
    - streaming and callbacks
    - model session and role lifecycle
    - adapter coordination
    - VRAM admission and reservations
    - telemetry and fallback policy
  computation_plane_not_owned_by_theorc_today:
    - full GGUF model loading
    - transformer graph numerical execution
    - CPU and CUDA kernels
    - native KV cache implementation
    - quantized dot product execution

