    completion_note: >-
      All 14 PHASE_0_ACCEPTANCE.yaml checks pass; OE-ADR-016 product-value
      thesis accepted by maintainer. See PHASE_0_ACCEPTANCE.yaml phase_result
      and DECISION_LOG.md for full evidence trail.
  - id: 1
    name: tiny_synthetic_float32_cpu_transformer
    state: implemented_stopped_for_review
    implementation: cpp20_cmake_reference_core
    completed_date: "2026-08-15"
    completion_note: >-
      Tools/OrcEnginePhase1/ (branch feat/orcengine-phase1, worktree
      F:/Ai/OrchestratorIDE-phase1). Zero external dependencies. Reuses Phase 0
      Fixture C dimensions. All operators implemented; differential harness
      (tests/test_gates.cpp) passes every intermediate tap, final logits, and
      greedy argmax against Python-oracle-exported tied and untied fixtures at
      float32 machine-epsilon divergence (~1e-7 vs 1e-3 threshold). Harness
      verified to catch injected faults, not just pass trivially. Freeze audit
      (same day) added: true autoregressive 8-step greedy decode matching an
      independently-computed Python trace token-for-token; a deliberate F32-
      vs-F64 accumulation A/B (F32 selected as default, F64 kept only as a
      comparison build -- F64 is marginally more precise but not materially
      necessary); confirmation that activation values were already a distinct
      type from ResidentView (naming/doc gap closed, not a real bug); and
      three bit-exact metamorphic tests. The 2026-08-16 hardening pass replaced
      the original resident-vector-only claim with a real in-memory F32Raw
      BackingExtent materialization path covering every weight, retained the tied
      alias-vs-physically-separate-duplicate proof, added exact 72-expectation
      completeness and malformed-model regression gates, and registered all six
      F32/F64 executables plus one regression suite (7 CTest cases). Stopped here
      per steering-document instruction pending maintainer review -- Phase 2 not
      started. See PHASE1_IMPLEMENTATION.md.
  - id: 2
    name: strict_gguf_reader_and_inspector
    state: not_started
  - id: 3
    name: real_model_float32_cpu_inference
    state: not_started
  - id: 4
    name: cpu_usability_baseline
    state: not_started
  - id: 5
    name: initial_quantization
    state: not_started
  - id: 6A
    name: resident_cuda_correctness_baseline
    state: not_started
    note: >-
      Formerly "Phase 6"; renumbered 6A because oversized-model evidence (see below)
      showed full-residency CUDA cannot be the only supported CUDA execution mode.
  - id: 6B
    name: execution_planner_explicit_residency_model
    state: not_started
    note: >-
      New phase, added per the Infinite Model Runtime steering review (2026-08-15):
      formalizes LogicalTensor / BackingExtent / ResidentView as distinct concepts (see
      ARCHITECTURE.md) and an ExecutionPlanner boundary distinct from TheOrc's own
      OrcScheduler, BEFORE paged/streamed CUDA is attempted -- so 6C doesn't retrofit
      residency semantics onto types that assumed permanent residency.
  - id: 6C
    name: paged_streamed_cuda_proof
    state: not_started
    note: >-
      Prove the same true-streaming layer-by-layer execution already demonstrated in
      Python (oracle/gguf_streaming_loader.py: Meta-Llama-3.1-8B ran at 3.17GB peak VRAM
      by never materializing the whole model) in the actual C++/CUDA engine, not just
      the Python research harness.
  - id: 6D
    name: compressed_transport_and_advanced_paging_research
    state: not_started
    note: >-
      Explicitly experimental/research per the steering doc -- separate source/transport/
      resident/compute precision, tensor/tile-level paging, ablation-informed
      quantization bit allocation. Allowed to fail; not a Phase 1 blocker.
  - id: 7
    name: stable_native_api_and_managed_wrapper
    state: not_started
    note: >-
      DELIBERATELY GATED on 6C, not just 6A: the stable C ABI must not be frozen before
      paged/nonresident execution has exercised the model/context/storage contracts, or
      the ABI bakes in a full-residency worldview the project's own evidence has already
      disproven. See OE-ADR-019 and Infinite_Model_Runtime_Claude_Handoff.md section 21.
  - id: 8
    name: experimental_theorc_backend
    state: not_started
  - id: 9
    name: agent_native_experiments
    state: not_started

