  - id: OE-ADR-017
    state: superseded
    summary: real-candidate logit tolerance investigation -- an initial hypothesis was tested and found false (left visible, corrected in place); resolved via real HF reference ground truth, our oracle proven exact match
  - id: OE-ADR-018
    state: accepted
    summary: independent_reproduction found two real bugs (broken requirements.txt pin, stale acceptance evidence), both fixed and verified
  - id: OE-ADR-019
    state: accepted
    summary: >-
      untied output-head bug invalidated the first Llama-3.1-8B ablation artifact (every
      forward pass used token_embedding.T even for untied models); fixed across all
      three oracle backends, original artifact preserved+invalidated with full
      provenance, corrected artifact replaces it. Also records the related
      LayerIntervention architectural correction (ablation = execution intervention on
      immutable shared weights, not N-times weight cloning) and the true-streaming
      oversized-model proof (Llama-3.1-8B, 3.17GB peak VRAM).
  - id: OE-ADR-020
