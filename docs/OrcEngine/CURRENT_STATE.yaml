  branch: codex/docs-truth-sync
  verified_product_commit: 6ecdd66e5b6bd83de2c5aee2f6c7ed86568d40b7
  pending_integration_commit: 16501dae4568391e8891dc091f8869d43ca6b7b9

status:
  lifecycle: phase_0_research
  implementation_exists: false
  runnable_engine_exists: false
  theorc_integration_exists: false
  production_ready: false
  default_runtime: false
  experimental_backend_available: false
  summary: >-
    OrcEngine is a proposed from-scratch inference-engine research project.
    Only the starter documentation suite exists. Existing TheOrc runtime paths
    remain authoritative and unchanged.

truth_labels:
  verified: directly observed in current code, reproducible evidence, or a primary source
  decided: accepted direction recorded in DECISION_LOG.md
  proposed: concrete design awaiting approval or evidence
  hypothesis: testable belief not yet demonstrated
  unknown: insufficient evidence
  out_of_scope: deliberately excluded from the current milestone

current_theorc_runtime:
  default:
    name: native_in_process
    construction: NativeWithFallbackRuntime_with_NoFallbackRuntime
    status: verified
    effective_since: "2026-07-29"
    failure_policy: fail_closed_no_automatic_ollama_substitution
  implementations:
    - name: OllamaRuntime
      execution: out_of_process_ollama
      status: verified
    - name: LlamaCppServerRuntime
      execution: out_of_process_llama_cpp_server
      status: verified
    - name: LLamaSharpRuntime
      execution: in_process_llamasharp_llama_cpp
      package_version: 0.27.0
      status: verified
  legacy_backend_field_default: Ollama
  legacy_backend_field_effect: used_when_native_main_chat_is_explicitly_disabled
  control_plane_owned_by_theorc:
    - runtime abstraction
    - prompt and tool pipeline
    - streaming and callbacks
    - model session and role lifecycle
    - adapter coordination
    - VRAM admission and reservations
    - telemetry and fallback policy
  computation_plane_not_owned_by_theorc_today:
    - full GGUF model loading
    - transformer graph numerical execution
    - CPU and CUDA kernels
    - native KV cache implementation
    - quantized dot product execution

decisions:
  - id: OE-ADR-001
    state: accepted
    summary: documentation and deterministic oracle precede implementation
  - id: OE-ADR-002
    state: accepted
    summary: coexist with existing runtimes; do not replace or change defaults
  - id: OE-ADR-003
    state: accepted
    summary: own inference semantics while allowing general compute libraries
  - id: OE-ADR-004
    state: accepted
    summary: reference-oracle-first development
  - id: OE-ADR-005
    state: accepted
    summary: first engine is tiny CPU-only float32 single-sequence greedy
  - id: OE-ADR-007
    state: accepted
    summary: compatibility claims use an exact tuple
  - id: OE-ADR-010
    state: accepted
    summary: OrcEngine is a separately authorized experimental research track
  - id: OE-ADR-011
    state: accepted
    summary: product value may be a prevented capability or measured improvement
  - id: OE-ADR-012
    state: accepted
    summary: Python oracle, C++20 core, later CUDA C++, C ABI, and C# wrapper
  - id: OE-ADR-013
    state: accepted
    summary: narrow standards-compatible strict GGUF ingestion
  - id: OE-ADR-014
    state: accepted
    summary: OE-L0-SYNTH-1 profile and SmolLM2-135M real-model candidate

