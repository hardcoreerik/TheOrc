phase_0_blockers:
  - complete model and tokenizer provenance and licensing review
  - pin primary and secondary oracle versions
  - approve intermediate capture schema
  - derive numerical tolerance profiles
  - approve artifact storage and retention

first_engine_scope:
  architecture_count: 1
  architecture_profile: OE-L0-SYNTH-1
  modality: text
  backend: cpu
  weight_and_activation_precision: float32_reference
  batch_size: 1
  sequence_count: 1
  decoding: greedy
  context: fixed_fail_closed_on_overflow

explicit_non_goals:
  - replacing LLamaSharpRuntime
  - replacing OllamaRuntime
  - production default changes
  - competitive performance in the correctness phase
  - CUDA before CPU correctness
  - quantization before float correctness
  - multiple model architectures
  - continuous batching
  - LoRA or adapter hot_swap
  - grammar constrained decoding
  - multimodal models
  - multi_GPU or HIVE distribution

