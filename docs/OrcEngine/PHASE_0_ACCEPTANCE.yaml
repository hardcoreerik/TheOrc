  - id: real_candidate_logits
    evidence: layer-boundary and final logits comparisons against both pinned oracles
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/hf_reference_check.py — our oracle (oracle/model.py,
      real SmolLM2-135M weights loaded directly) compared against the actual HuggingFace
      transformers reference implementation (LlamaForCausalLM, float32, genuine
      third-party code). Result: EXACT match, max diff 0.000008 across all 10 examined
      tokens (effectively 0.0 at display precision), argmax matches (token 260).
      Investigation history (see DECISION_LOG.md OE-ADR-017 for the full account,
      including a falsified intermediate hypothesis, left visible not rewritten):
      an initial comparison against llama.cpp alone showed real divergence (up to 0.95
      on one token). Ruled out via oracle/real_candidate_self_consistency_check.py that
      this was a bug in our own code (NumPy vs PyTorch, both ours, agree to 3.29e-05) or
      a tokenization mismatch (verified via llama-server's own /tokenize endpoint).
      Root-caused via the HF reference: our oracle is exactly correct; llama.cpp itself
      diverges from ground truth on this model. Phase 0 gates OrcEngine's own
      correctness, which is now proven three independent ways (hand-derived, cross-
      implementation, and real-model ground truth). Verified 2026-08-15.
  - id: independent_reproduction
    evidence: reviewer reproduces the synthetic bundle from documented commands
    result: pass
    result_evidence: |
      See docs/OrcEngine/DECISION_LOG.md OE-ADR-018 for the full account. A genuinely
      fresh subagent (isolated git worktree, zero prior context, fresh venv) followed
      Tools/OrcEnginePhase0/README.md's documented commands literally and found two real
      issues without being told to look for them: (1) pip install -r requirements.txt, run
      exactly as documented, failed with a real dependency conflict (tokenizers==0.23.1 vs
      transformers==5.15.0's requirement of tokenizers<=0.23.0); (2) this file's own
      synthetic_operator_microcases evidence was stale (said 10/10, actual/README say
      11/11). All 17 oracle.* commands the reviewer could run (after deviating around
      issue 1) passed with every cited number matching README/this file exactly. Both
      issues fixed with evidence (tokenizers pin corrected to 0.22.2; stale evidence
      corrected and the staleness itself documented). Fix independently confirmed by a
      direct fresh-venv reinstall + spot-check (isolated-worktree re-verification hit an
      unrelated git worktree-configuration infrastructure issue, not a fix problem):
      pip install succeeded with zero conflicts, oracle.microcases/fixture_c/
      synthetic_layer_taps_check all pass matching cited evidence. Verified 2026-08-15.
