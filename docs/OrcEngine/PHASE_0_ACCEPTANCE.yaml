required_checks:
  - id: provenance_complete
    evidence: manifest with source, tokenizer, converter, GGUF, environment, license, and SHA-256 identities
    result: pass
    result_evidence: |
      Source: Tools/OrcEnginePhase0/artifacts/smollm2-135m/download_manifest.json
      (oracle/download_candidate.py) -- repo_id, pinned revision
      93efa2f097d58c2a74874c7e644dbc9b0cee75a2, per-file SHA-256 for every downloaded
      file including model.safetensors and tokenizer.json.
      Tokenizer: same download_manifest.json (tokenizer.json, vocab.json, merges.txt
      all hashed).
      Converter: oracle/convert_real_candidate.py (committed, git-tracked, deterministic
      given the same source files).
      GGUF: converted file SHA-256 printed by convert_real_candidate.py
      (9a20b74743b21fe3da9f0298ab82de47aa66facdcf71feb709f0bf16ab516e9e for the
      pre-tokenizer-fix revision; fffab10c5298f8b1399088e893c1ddd64e48cd7e5020982a5b2a848e445a4aac
      after adding tokenizer.ggml.pre="smollm" -- both recorded, not just the latest,
      since the fix changed the artifact identity).
      Environment: CPython 3.14.3, numpy 2.5.2, torch 2.13.0+cpu, gguf 0.19.0,
      huggingface_hub 1.27.0, safetensors, tokenizers -- all pinned in requirements.txt.
      License: docs/OrcEngine/LICENSING_AND_ATTRIBUTION.md attribution ledger entry,
      Apache-2.0, confirmed by direct inspection of the downloaded README.md.
      Verified 2026-08-15.
  - id: three_way_oracle_independence
    evidence: hand-derived microcases, Python semantic oracle, and pinned llama.cpp deployment oracle
    result: pass
    result_evidence: |
      Three independence classes, all with real run evidence (2026-08-15):
      1. Independent ground truth: Tools/OrcEnginePhase0/oracle/microcases.py, 11/11
         hand-derived operator microcases pass.
      2. Primary semantic oracle: oracle/model.py (NumPy) cross-validated against
         oracle/torch_oracle.py (independently re-derived in PyTorch, not translated
         from the NumPy code) via oracle/cross_oracle_check.py -- max_abs_diff=2.4e-07
         on both n_layers=1 and n_layers=2 configs.
      3. Secondary deployment oracle: oracle/export_gguf.py writes Profile A's own
         weights into a real "llama"-architecture GGUF (Profile A's RMSNorm/GQA/RoPE/
         SwiGLU block semantics ARE the standard llama.cpp architecture, just tiny --
         not a proprietary synthetic format). oracle/llama_cpp_deployment_oracle.py
         starts a pinned llama.cpp b10436 (2026-08-14) llama-server.exe against it and
         requests logprobs via its OpenAI-compatible /completion endpoint. Tokenization
         via distinct control tokens ("<0>".."<31>", TOKEN_TYPE=CONTROL) verified exact
         via llama-tokenize: prompt "<1><5><9><3><7>" -> [1,5,9,3,7], matching intent
         exactly. Result: argmax token agrees exactly (token 7 both sides); top-5
         log_softmax values agree within 0.02-0.04 (looser cross-language/cross-library
         tolerance than the intra-Python legs, documented and justified in
         oracle/llama_cpp_deployment_oracle.py -- not widened to force a pass).

  - id: artifact_schema_complete
    evidence: every tensor record includes name, dtype, logical shape, byte strides, layout, endianness, and hash
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/manifest.py (OracleManifest, all schema
      sections) + oracle/artifact_record.py (TensorArtifactRecord: name, dtype, logical_shape,
      byte_strides, layout, endianness, sha256) + oracle/generate_manifest.py, which generates
      a real manifest from a live Fixture C run, writes it to
      Tools/OrcEnginePhase0/artifacts/fixture_c_manifest.yaml, reloads it from disk, and
      validates every required field is present. 8/8 top-level sections, 7/7 tensor artifacts
      each with all 7 required fields. model/gguf/tokenizer sections honestly marked
      not_applicable (synthetic profile, no real model/GGUF/tokenizer yet) rather than
      fabricated. Verified 2026-08-15.
  - id: tokenizer_dual_source_agreement
    evidence: source-tokenizer and GGUF-embedded-tokenizer fixtures agree exactly or candidate is rejected
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/tokenizer_dual_source_check.py — 5/5
      fixtures (ASCII, punctuation, digits, leading whitespace, non-ASCII "café résumé")
      tokenize to byte-identical token ID lists between the pinned HF tokenizer.json
      (via the `tokenizers` library) and llama.cpp's own tokenizer reading our converted
      GGUF's tokenizer.ggml.* metadata. Required a real fix found and applied, not just
      luck: tokenizer.ggml.pre was initially omitted, llama.cpp warned "GENERATION
      QUALITY WILL BE DEGRADED"; added pre="smollm" (confirmed against llama.cpp's own
      convert_hf_to_gguf_update.py mapping table) and the warning disappeared. Verified
      2026-08-15.
  - id: raw_prompt_identity
    evidence: raw bytes, rendered template, token IDs, and their hashes are retained
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/raw_prompt_identity.py, writing
      artifacts/raw_prompt_identity_manifest.json — 6 fixture records (1 synthetic
      Profile A via control tokens, 5 real SmolLM2-135M fixtures via the pinned HF
      tokenizer), each with raw_text, raw_bytes_sha256, rendered_prompt (explicitly
      recorded as equal to raw_text for all current fixtures, not silently assumed —
      no chat template is in scope yet), rendered_prompt_sha256, token_ids, and
      token_ids_sha256. Verified 2026-08-15.
  - id: synthetic_operator_microcases
    evidence: hand-verifiable operator vectors pass exact or approved numeric comparisons
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/microcases.py — 11/11 microcases pass
      (matmul, RMSNorm, softmax, causal mask, causal_mask_rectangular, RoPE at position 0
      and position 1, SiLU, elementwise add/multiply, embedding lookup). Expected values
      from a scalar math-stdlib reference path independent of oracle/ops.py. Originally
      verified 2026-08-14 at 10/10; causal_mask_rectangular was added 2026-08-15 for
      Fixture C's incremental-decode support (see fixture_c.py) and this entry was stale
      until an independent-reproduction pass caught the drift — corrected 2026-08-15.
  - id: synthetic_layer_taps
    evidence: all required OE-L0-SYNTH-1 intermediate taps pass named tolerance profiles
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/synthetic_layer_taps_check.py — every
      one of the 17 required per-layer taps (both layers of the full n_layers=2 Profile A)
      plus 3 top-level taps (input_embedding, final_normalized_state, logits) = 37 tap
      comparisons, all pass between the NumPy (oracle/model.py) and independently-written
      PyTorch (oracle/torch_oracle.py) implementations. Max diff across all 37:
      4.768e-07, well within tolerance_profile atol=1e-5/rtol=1e-4. masked_attention_scores'
      -inf pattern (causal mask) verified to match exactly, not just finite entries.
      Verified 2026-08-15.
  - id: cache_equivalence
    evidence: full-prefix and incremental decode last-position states and logits agree within approved bounds
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/fixture_c.py — full Profile A (n_layers=2),
      seq=5 token sequence. Full-prefix forward() vs prefill(4)+cached-decode(1) last-position
      logits agree, max_abs_diff=2.384e-07 (well within 1e-6 atol/1e-5 rtol). Repeated with a
      fresh KV-cache object (context reset) with identical result. Cross-run bit-identical
      determinism confirmed. Verified 2026-08-15.
  - id: near_tie_logits
    evidence: fixtures include a controlled near-tie and verify logits, top-token margin, argmax, and exact-tie rule
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/fixture_near_tie.py — constructs a near-tie
      (two tied-embedding rows perturbed by 1e-4) yielding margin=0.000145 between tokens 7/8,
      and an exact tie (identical rows) yielding bit-exact-equal logits (-0.1041162833571434 ==
      -0.1041162833571434). Exact-tie decode rule (Profile A: lowest token ID wins) verified
      directly on a synthetic 2-way-tied logits vector: argmax([5,5,3]) = 0. Both logits, the
      margin, the selected token, and the tie rule are recorded, not just token agreement.
      Verified 2026-08-15.
  - id: deterministic_regeneration
    evidence: two clean regenerations produce identical non-floating identities and approved floating comparisons
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/deterministic_regeneration.py — runs
      oracle/regen_artifact.py as two SEPARATE python3 subprocesses (fresh interpreter each
      time, not two in-process calls). Non-floating identities (shapes, dtypes, selected
      tokens, weight-array SHA-256s) exactly equal. Floating logits bit-exact (identical
      SHA-256, max_abs_diff=0.0) across the two processes. Verified 2026-08-15.
  - id: fault_injection
    evidence: every required seeded fault fails first at its expected checkpoint class
    result: pass
    result_evidence: |
      All 7 required fault types now detected, each localized to its correct checkpoint:
      1-6 in Tools/OrcEnginePhase0/oracle/fault_injection.py (against Fixture B /
      forward_cached): transposed projection matrix -> q_projection; off-by-one
      position -> q_after_rope; incorrect RoPE pairing -> q_after_rope; missing
      causal mask -> masked_attention_scores; changed RMSNorm epsilon ->
      pre_attention_normalized_state; swapped K/V cache write ->
      cache_slice_after_write.k.
      7. tokenizer_special_token_error in oracle/tokenizer_special_token_fault.py
      (against the real SmolLM2-135M candidate, correctly deferred until that
      conversion existed): mislabeling "<|im_start|>" CONTROL->NORMAL in a faulted
      GGUF's tokenizer.ggml.token_type causes tokenization of "<|im_start|>user" to
      diverge from [1, 4093] (matching the true HF tokenizer) to an 8-token
      shattered sequence. Verified 2026-08-15.
  - id: real_candidate_conversion
    evidence: pinned conversion command and GGUF hash with strict parser manifest
    result: pass
    result_evidence: |
      Tools/OrcEnginePhase0/oracle/real_candidate_conversion_manifest.py,
      writing artifacts/real_candidate_conversion_manifest.json — conversion command,
      converter script SHA-256, source safetensors SHA-256, output GGUF SHA-256
