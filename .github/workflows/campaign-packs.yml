name: Campaign Packs

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'docker/packs/**'
      - '.github/workflows/campaign-packs.yml'

permissions:
  contents: read
  packages: write

jobs:
  alien-signal-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/theorc-pack-alien-signal-search
          tags: type=raw,value=1.0.0
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: docker/packs/alien-signal-search
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Record immutable image reference
        run: echo "ghcr.io/${{ github.repository_owner }}/theorc-pack-alien-signal-search@${{ steps.build.outputs.digest }}" | tee alien-image.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: alien-signal-search-image-digest
          path: alien-image.txt
